[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EpriX"
version = "0.1.0"
description = "EpriX: Advanced Data Packing, Unpacking, Encryption, and Compression Tool with CLI and FastAPI Web Interface for Secure Archiving and Data Transfer."
readme = "README.md"
authors = [
    {name = "Abdulaziz Alqudimi", email = "eng7mi@gmail.com"},
]
license = {file = "LICENSE"}
requires-python = ">=3.8"
keywords = [
    "packing", "unpacking", "encryption", "compression", "cli", "fastapi",
    "security", "cryptography", "archiving", "data-transfer", "python-tool",
    "multi-layer-encryption", "data-protection", "secure-archiving", "file-utility"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Utilities",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "cryptography",
    "python-multipart",
    "argon2-cffi",
    "zstandard",
    "pathspec",
    "python-magic",
    "chardet",
]

[project.urls]
"Homepage" = "https://github.com/Alqudimi/EpriX"
"Bug Tracker" = "https://github.com/Alqudimi/EpriX/issues"
"Source Code" = "https://github.com/Alqudimi/EpriX"
"Documentation" = "https://github.com/Alqudimi/EpriX#readme"

[project.scripts]
eprix = "EpriX.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["EpriX*"]
exclude = []

[tool.setuptools.package-data]
"EpriX" = ["static/*.html"]
